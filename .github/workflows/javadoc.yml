name: Publish project page

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: temurin
          cache: maven
      - name: Generate Javadoc
        run: mvn javadoc:javadoc --no-transfer-progress
      - name: Assemble site
        # The landing page at the root, the Javadoc under /api/.
        run: |
          mkdir -p site/api
          cp -R docs/. site/
          cp -R target/site/apidocs/. site/api/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
